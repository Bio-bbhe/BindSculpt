# config/config.yaml
project_name: BindSculpt
log_level: INFO
run_name: "default_run"
seed: 42

paths:
  target_fasta: data/inputs/9j8z_template.fasta
  data_inputs: data/inputs
  base_output_dir: data/outputs_v0705_9J8Z_template
  run_output_dir: ${paths.base_output_dir}/${run_name}
  model_weights: data/models
  embeddings_dir: ${paths.run_output_dir}/embeddings
  surrogate_models_dir: ${paths.run_output_dir}/surrogate_models
  log_dir: ${paths.run_output_dir}/logs
  target_msa_dir: '/home/hebeibei/Work/dl/code/BindSculpt/data/inputs/9j8z_template.a3m'  # for AF3
  target_cif_path: '/home/hebeibei/Work/dl/code/BindSculpt/data/inputs/9j8z_template.cif'  # as template

models:
  seq2seq:
    model_path: /home/hebeibei/Data/model/bgi_protein_design/weights/seq2seq/hf # e.g., data/models/seq2seq_weights/hf
    tokenizer_path: /home/hebeibei/Data/model/esm2_t33_650M_UR50D # e.g., data/models/seq2seq_weights/esm2_t33_650M_UR50D
    # Parameters for generation
    generation_params:
      seed: 42
      num_return_sequences: 30 # 10 # Number of binders to generate for EACH input target
      batch_size: 4
      encoder_max_length: 500 # Max length for input target sequence
      max_length: 100 # 150 Max length of the generated binder sequence
      min_length: 50  # Min length of the generated binder sequence
      repetition_penalty: 1.5
      no_repeat_ngram_size: 4
      num_workers: 12 # Reduced for conciseness; adjust based on CPU/RAM

      # Parameters for 'beam' sampling strategy
      num_beams: 10
      num_beam_groups: 5 # Must be <= num_beams
      diversity_penalty: 2.0

      # Parameters for 'top_k' and 'top_p' sampling strategies
      top_k: 50
      top_p: 0.95
      temperature: 1.5 # Higher value (e.g., 1.0 or more) means more diverse

    # List of sampling strategies to use (can be one or multiple)
    sampling_strategies: 'top_p' # beam, top_k,  This will be a list in Python
    define_binding:
      enabled: True
      binding_region: 1-11,68-84,148-170,241-253  # comma seperated regions


  alphafold3:
    enabled: True
    # The actual Python script for running AlphaFold3
    executable_path: /home/hebeibei/Software/AlphaFold3/alphafold3-main/run_alphafold.py

    # Base directories for AlphaFold3's dependencies
    db_dir: /media/Data/hebeibei/AlphaFold3_Genetic_Databases/
    model_dir: /media/Data/hebeibei/model/AlphaFold3/

    # Output subdirectory within your project's data/outputs/
    output_subdir: af3_predictions

    # AF3 specific parameters
    jackhmmer_n_cpu: 24
    nhmmer_n_cpu: 24
    max_template_date: 2025-05-09 # Keep this updated or remove if not needed
    force_output_dir: True # Maps to --force_output_dir True
    conda_env_name: "af3"
    num_diffusion_samples: 3 # 5

  esm_encoder:
    enabled: True # Set to True to use ESM embeddings
    model_location: /media/Data/hebeibei/model/esm2_t33_650M_UR50D # Path to your ESM model (e.g., ESM-1b)
    batch_size: 400 # Batch size for embedding generation
    truncation_seq_length: 250 # Max sequence length for ESM truncation

  surrogate_model:
    enabled: True # Set to True to use surrogate model
    target_metric: 'combined_score' # Metric to predict (e.g., 'iptm' or 'ptm' or 'combined_score‘ or 'ranking_score‘)
    save_model: True # Whether to save the trained model after each iteration
    save_dir: ${paths.surrogate_models_dir} # Directory to save models
    params: # RandomForestRegressor parameters
      n_estimators: 100
      criterion: 'friedman_mse'
      max_depth: null # No max depth
      min_samples_split: 2
      min_samples_leaf: 1
      max_features: 1.0 # Use all features
      min_impurity_decrease: 0.0
      bootstrap: True
      oob_score: False
      random_state: 42
      verbose: False
      warm_start: False
      ccp_alpha: 0.0
      n_jobs: -1 # Use all available CPU cores

  proteinmpnn:
    enabled: True  # Set to True to enable ProteinMPNN redesign
    # IMPORTANT: Path to your ProteinMPNN's main script/executable
    executable_path: dependencies/ProteinMPNN/protein_mpnn_run.py  # Example path, adjust as needed
    helper_script_dir: dependencies/ProteinMPNN/helper_scripts/
    num_seq_per_target_pdb: 20
    sampling_temp: 0.75  # 0.1
    fixed_pos_distance_threshold: 2.5  # 2.5 = almost completely re-design binder
    chains_to_design: [ "B" ]
    chains_to_keep_fixed_for_mpnn: [ "A" ]
    num_top_mpnn_seqs_to_evaluate: 1
    relative_solvent_accessibility: 20  # for final design, get surface-exposed residues to redesign

mutagenesis:
  enabled: True
  # Strategy for each AL iteration: 'single_site', 'multiple_site', 'alternate'
  # 'alternate': Switches between single_site and multiple_site every other iteration
  mutation_strategy_per_iteration: "single_site" # "single_site", "multiple_site", or "alternate"

  single_site:
  # No specific parameters needed besides inherent logic here

  multiple_site:
    mutation_rate_percent: 0.1
    min_mutations_per_binder: 2
    max_mutations_per_binder: 4 # Max number of random mutations for multi-site
    num_mutants_per_parent: 2000 # How many random multi-mutants to generate per parent

active_learning:
  num_initial_diversity_groups: 4 # 10
  num_iterations: 16 # 15
#  batch_size: 3 # 10
#  acquisition_strategy: 'top_iptm' # Maps to a function in src/core/acquisition.py
  selection_strategy_for_evaluation: "top_bottom_uncertain_predicted_score" # "top_iptm", "top_n_bottom_m_predicted_iptm", "top_n_uncertain_m_predicted_iptm","top_bottom_uncertain_predicted_iptm", "random",
  num_parent_binders_to_optimize: 1 # 10
  num_binders_to_select_in_each_parent_for_mutagenesis: 5 # 15
  num_top_candidates_per_group: 10 # 13   # Number of top candidates to select PER GROUP (e.g., per parent)
  num_bottom_candidates_per_group: 1 # 1 # Number of bottom candidates to select PER GROUP (e.g., for exploration)
  num_uncertain_candidates_per_group: 1 # 1 False  # Number of top uncertain candidates to select PER GROUP (e.g., for exploration)
  weight_for_iptm: 0.4
  weight_for_ptm: 0.3
  weight_for_plddt: 0.3
  weight_for_pae: -0.5
  weight_for_sc: 0.1
  weight_for_hs: -0.5  # 0.5
  weight_for_unsH: -0.2

  # Parameters for "Solved Lineage" Handling ---
  solved_lineage_threshold_metric_value: 0.8 # e.g., combined_score >= 0.85
  solved_lineage_min_binders_count: 2    # Min number of binders above threshold to consider lineage "solved"

  # Quota for "Solved" Lineages during AF3 candidate selection
  solved_lineage_num_top_candidates: 1
  solved_lineage_num_bottom_candidates: 1
  solved_lineage_num_uncertain_candidates: 1
  # The selection_strategy_for_evaluation will apply for unsolved lineages,
  # and a modified version (top/bottom/uncertain) for solved ones.

  proteinmpnn_redesign_frequency: 5 # 1
  proteinmpnn_redesign_threshold: 0.4 # 0.3
  proteinmpnn_num_candidates_to_redesign: 2 # 2

filters:
  sequence_filters:
    enabled: False
    min_length: 10
    max_length: 250
    max_cys_num: 1
    # ...
  complex_filters:
    enabled: True
    min_iptm: 0.7  # 0.7
    min_ptm: 0.8  # 0.8
    min_complex_plddt: 0.8  # 0.8
    min_binder_plddt: 0.7  # 0.7
    min_pae: 5  # 5
    num_interface_resi: 7  # 7
    distance_for_counting_interface: 3.5  # 3.5
    min_shape_complementarity: 0.55  # 0.55
    max_interface_delta_unsat_hbonds: 3  # 3
    max_surface_hydrophobicity: 0.35  # 0.35
